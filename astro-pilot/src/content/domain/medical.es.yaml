intro:
  flag: 🩺
  title: Interpretación médica
  desc: Vocabulario, registro y ética para contextos clínicos. El coach también añade contexto médico cuando tu frase del diario usa palabras clave clínicas.
sections:
- id: register
  chapter: Registro
  title: Siempre formal con el personal médico y los pacientes
  kind: rule
  ruleTitle: Regla básica
  ruleText: Usa por defecto el trato formal (usted / vous / formal English). Prefiere los términos clínicos precisos frente al argot. Interpreta todo lo que se dice, sin añadir ni omitir nada.
- id: ethics
  chapter: Ética
  title: HIPAA y los límites del rol
  kind: bullets
  bullets:
  - <strong>Exactitud</strong> — Interpreta todo lo que se dice; no resumas ni elimines contenido.
  - <strong>Imparcialidad</strong> — No defiendas posturas ni tomes partido.
  - <strong>Confidencialidad</strong> — Toda la información es confidencial (HIPAA).
  - <strong>Límites del rol</strong> — No eres mediador cultural, asesor ni clínico.
  - <strong>Traducción a la vista</strong> — Lee primero el documento completo, luego traduce manteniendo el registro.
