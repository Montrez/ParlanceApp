- id: scenarios
  chapter: Práctica
  title: Sugerencias para el diario
  kind: bullets
  bullets:
  - Describe el motivo de consulta principal del paciente y desde cuándo tiene los síntomas.
  - Explica las instrucciones de la medicación (dosis, frecuencia, con/sin alimentos).
  - Interpreta a un profesional de salud preguntando sobre alergias y medicamentos actuales.
