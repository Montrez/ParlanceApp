  title: Medical interpreting
  desc: Vocabulary, register, and ethics for clinical settings. Coach RAG also injects medical context when your journal sentence uses clinical keywords.
sections:
- id: register
  chapter: Register
  title: Always formal with providers and patients
  kind: rule
  ruleTitle: Core rule
  ruleText: Default to formal address (usted / vous / formal English). Prefer precise clinical terms over slang. Interpret everything said — nothing added, nothing omitted.
- id: ethics
  chapter: Ethics
  title: HIPAA and role boundaries
  kind: bullets
  bullets:
  - <strong>Accuracy</strong> — Interpret everything said; no summarizing away content.
  - <strong>Impartiality</strong> — Do not advocate or take sides.
  - <strong>Confidentiality</strong> — All information is confidential (HIPAA).
  - <strong>Role boundaries</strong> — You are not a cultural broker, advisor, or clinician.
  - <strong>Sight translation</strong> — Read the full document first, then translate maintaining register.
