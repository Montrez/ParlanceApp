intro:
  flag: 🩺
  title: Interprétation médicale
  desc: Vocabulaire, registre et éthique pour les contextes cliniques. Le coach ajoute aussi du contexte médical quand votre phrase du journal utilise des mots-clés cliniques.
sections:
- id: register
  chapter: Registre
  title: Toujours formel avec le personnel médical et les patients
  kind: rule
  ruleTitle: Règle de base
  ruleText: Utilisez par défaut le vouvoiement (usted / vous / formal English). Préférez les termes cliniques précis à l'argot. Interprétez tout ce qui est dit, sans rien ajouter ni omettre.
- id: ethics
  chapter: Éthique
  title: HIPAA et les limites du rôle
  kind: bullets
  bullets:
  - <strong>Exactitude</strong> — Interprétez tout ce qui est dit ; ne résumez pas et ne supprimez rien.
  - <strong>Impartialité</strong> — Ne défendez aucune position et ne prenez pas parti.
  - <strong>Confidentialité</strong> — Toutes les informations sont confidentielles (HIPAA).
  - <strong>Limites du rôle</strong> — Vous n'êtes ni médiateur culturel, ni conseiller, ni clinicien.
  - <strong>Traduction à vue</strong> — Lisez d'abord le document entier, puis traduisez en conservant le registre.
