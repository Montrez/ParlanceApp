- id: scenarios
  chapter: Pratique
  title: Suggestions pour le journal
  kind: bullets
  bullets:
  - Décrivez le motif de consultation principal du patient et depuis quand durent les symptômes.
  - Expliquez les instructions du médicament (dose, fréquence, avec/sans nourriture).
  - Interprétez un soignant qui demande les allergies et les médicaments actuels.
