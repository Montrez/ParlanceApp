name: Claire Android internal test

# Thursday Aug 13, 2026 at 5:30 PM Eastern via workflow_dispatch (local timer).
# Cron at 6:00 PM Eastern is a backup. Cache key prevents a double post.
on:
  schedule:
    - cron: "0 22 13 8 *"
  workflow_dispatch:

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if already posted
        id: gate
        uses: actions/cache@v4
        with:
          path: claire-android-internal-posted
          key: claire-android-internal-2026-08-13

      - name: Post as Claire to #announcements
        if: steps.gate.outputs.cache-hit != 'true'
        env:
          WEBHOOK_CLAIRE: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_CLAIRE:-}" ]; then
            echo "DISCORD_ANNOUNCE_WEBHOOK not set; cannot post as Claire."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            today=$(date -u +%Y-%m-%d)
            if [ "$today" != "2026-08-13" ]; then
              echo "Skipping scheduled run on $today (intended 2026-08-13)."
              exit 0
            fi
          fi

          CLAIRE_TEXT=$(jq -rn '
            "**Parlance is on Android**\n\nInternal testing is open on Google Play. It will not show up if you search the store. You need the link, and you need to be on the tester list.\n\nOn your Android phone:\n\n1. Sign into the Google account we added as a tester\n2. Open this link:\nhttps://play.google.com/apps/internaltest/4701648803954304490\n3. Tap Become a tester\n4. Tap Download it on Google Play\n5. Install Parlance\n\nIf Play says you are not a tester, post in #beta-testers with the Google account you used and we will add you.\n\nThis is an early Android build. Journal, dialect guides, and cloud AI coaching are in. Parlance Plus and call packs are still iOS for now.\n\nQuestions and bugs go in #beta-testers."
          ')

          curl -fsSL -X POST "$WEBHOOK_CLAIRE" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$CLAIRE_TEXT" '{content: $content}')"

          mkdir -p claire-android-internal-posted
          echo posted > claire-android-internal-posted/flag
