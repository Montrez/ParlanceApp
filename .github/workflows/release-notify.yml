name: Release notification

# Fires when you publish a GitHub Release (tag + release notes)
on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post #whats-new + Claire #announcements
        env:
          WEBHOOK_WHATS_NEW: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          WEBHOOK_CLAIRE:    ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          TAG:       ${{ github.event.release.tag_name }}
          TITLE:     ${{ github.event.release.name }}
          BODY:      ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          APP_STORE_LIVE: ${{ vars.APP_STORE_LIVE }}
          WHATS_NEW_CHANNEL: "1520432921708724274"
        run: |
          set -euo pipefail

          if [ "$PRERELEASE" = "true" ]; then
            LABEL="TestFlight beta"
            COLOR=16753920
            PLATFORM_NOTE="Available now on **TestFlight**. Update in the app or accept the invite."
          elif [ "$APP_STORE_LIVE" = "true" ]; then
            LABEL="App Store release"
            COLOR=5763719
            PLATFORM_NOTE="Available now on the **App Store**. Update in the App Store or search Parlance."
          else
            LABEL="Product update"
            COLOR=5763719
            PLATFORM_NOTE="Available now on **GitHub Pages**: https://montrez.github.io/ParlanceApp/. Coming soon to **TestFlight** for iOS users."
          fi

          # Community-facing notes only: drop GitHub/dev sections (Archive, Still open, etc.)
          SHORT_BODY=$(printf '%s\n' "$BODY" | awk '
            BEGIN { skip = 0 }
            /^###[[:space:]]+[Aa]rchive/ { skip = 1; next }
            /^###[[:space:]]+[Ss]till[[:space:]]+[Oo]pen/ { skip = 1; next }
            /^###[[:space:]]+[Dd]eveloper/ { skip = 1; next }
            /^###[[:space:]]+[Ff]or[[:space:]]+[Dd]evelopers/ { skip = 1; next }
            /\*\*[Aa]rchive this build:\*\*/ { next }
            /^[Aa]rchive this build:/ { next }
            /^### / { skip = 0 }
            /^## / && !/^##[[:space:]]+Parlance/ { skip = 0 }
            skip { next }
            { print }
          ' | sed -e 's/[[:space:]]*$//' | awk '
            NF { blank = 0; print; next }
            !blank { blank = 1; print }
          ' | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' | head -c 1900)

          # Detailed notes → #whats-new
          FULL_PAYLOAD=$(jq -n \
            --arg title "🚀 Parlance $TAG — $LABEL" \
            --arg desc "$SHORT_BODY" \
            --arg note "$PLATFORM_NOTE" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                fields: [
                  { name: "📱 Availability", value: $note, inline: false }
                ],
                footer: { text: "Parlance" },
                timestamp: (now | todate)
              }]
            }')

          curl -fsSL -X POST "$WEBHOOK_WHATS_NEW" \
            -H "Content-Type: application/json" \
            -d "$FULL_PAYLOAD"

          # Short plain-text post as Claire → #announcements
          if [ -z "${WEBHOOK_CLAIRE:-}" ]; then
            echo "DISCORD_ANNOUNCE_WEBHOOK not set; skipping Claire announcement."
            exit 0
          fi

          # Keep Claire's announce short; full changelog lives in #whats-new
          HIGHLIGHT=$(printf '%s\n' "$SHORT_BODY" | awk '
            BEGIN { n = 0 }
            /^[-*]/ && n < 4 { print; n++; next }
            /^###/ { next }
            /^##/ { next }
            NF && n == 0 && length($0) < 200 { print; n++ }
          ' | head -c 700)

          if [ -z "$HIGHLIGHT" ]; then
            HIGHLIGHT="See the full notes in <#${WHATS_NEW_CHANNEL}>."
          fi

          CLAIRE_TEXT=$(jq -rn \
            --arg tag "$TAG" \
            --arg highlights "$HIGHLIGHT" \
            --arg note "$PLATFORM_NOTE" \
            --arg whats "$WHATS_NEW_CHANNEL" \
            '"**Parlance \($tag)** is out.\n\n\($highlights)\n\n\($note)\n\nFull notes in <#\($whats)>."')

          CLAIRE_PAYLOAD=$(jq -n --arg content "$CLAIRE_TEXT" '{content: $content}')

          curl -fsSL -X POST "$WEBHOOK_CLAIRE" \
            -H "Content-Type: application/json" \
            -d "$CLAIRE_PAYLOAD"
