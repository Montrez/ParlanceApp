name: platform sync

on:
  push:
    paths:
      - 'Parlance/web/journal.js'
      - 'Parlance/ContentView.swift'
      - 'Parlance/Info.plist'
      - 'android/**'
      - 'scripts/check_platform_sync.py'
  pull_request:
    paths:
      - 'Parlance/web/journal.js'
      - 'Parlance/ContentView.swift'
      - 'Parlance/Info.plist'
      - 'android/**'
      - 'scripts/check_platform_sync.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native bridge protocol + version parity across iOS and Android
        run: python3 scripts/check_platform_sync.py
